<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="display.css">
    <title>Elementos inline y block</title>
</head>

<body>
    <!-- elementos en bloque -->
    <div class="caja inline">
        hola soy una caja div
    </div>
    <p class="caja inline">hola soy un parrafo</p>

    <!-- elementos en linea -->

    <a href="#" class="caja inline-block">enlace</a>
    <img class="caja inline-block" width="200px" src="./imagenes/bosque.png" alt="">
    <span class="caja inline-block">Hola soy un texto dentro de un span</span>

    <h1 class="caja none">hola</h1>
</body>

</html>
