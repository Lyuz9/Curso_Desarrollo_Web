<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etiquetas de texto</title>
</head>

<body>
    <!-- Bold sin importancia semantica -->
    <b>Bold</b>
    <br>

    <!-- Strong con importancia semantica -->
    <strong>Strong</strong>
    <br>

    <!-- I sin importancia semantica -->
    <i>Italic</i>
    <br>

    <!-- EM con importancia semantica -->
    <em>Enfasis</em>
    <br>

    <!-- texto pequeño -->
    <small>Small</small>
    <p>hola soy un texto <small>small</small> </p>
    <br>

    <!-- texto marcado -->
    <p>hola soy un texto <mark>marcado</mark> </p>
    <br>

    <!-- texto borrado -->
    <p>hola soy un texto <del>borrado</del> </p>
    <br>

    <!-- texto insertado -->
    <p>hola soy un texto <ins>insertado</ins> </p>
    <br>

    <!-- texto sub -->
    <p>hola soy un texto <sub>subscript</sub> </p>
    <br>

    <!-- texto sup -->
    <p>hola soy un texto <sup>superscript</sup> </p>
    <br>
    
</body>

</html>
