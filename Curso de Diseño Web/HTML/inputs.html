<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inputs</title>
</head>

<body>
    <form action="">

        <input type="text">
        <br>


        <input type="email" name="correo" id="correo" placeholder="correo@correo.com">
        <br>
        
        
        <input type="password" name="password" id="password" placeholder="Ingrese su contraseña">
        <br>
        
        
        <br>
        <input type="number" name="" id="" min="5" max="10" value="6" placeholder="1">
        
        
        <br>
        <input type="file" name="" id="" accept=".jpg, .png" multiple>


        <br>
        <input type="range" name="" id="" min="1" max="200" value="100">


        <br>
        <input type="color" name="" id="">


        <br>
        <input type="date" name="" id="">


        <br>
        <input type="datetime-local" name="" id="">


        <br>
        <input type="time" name="" id="">


        <br>
        <input type="hidden" name="valor-oculto" value="valor-oculto" id="">


        <br>
        <input type="image" src="imagenes/paisaje1.jpg" width="100px" name="" id="">


        <br>
        <input type="reset" value="reiniciar-formulario" name="" id="">
        
        <input type="submit" value="Enviar">
        <button type="submit" >Enviar</button>
    </form>
</body>

</html>
